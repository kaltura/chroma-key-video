<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>chroma-key-video e2e fixture</title>
<style>
  body { margin: 0; background: #222; }
  #stage canvas { display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<!-- hls.js dist is a UMD/global build, loaded as a classic script (executes
     before the deferred module script below) so `window.Hls` exists when
     the test helpers that use it run. Test-only devDependency. -->
<script src="/node_modules/hls.js/dist/hls.min.js"></script>
<script type="module">
import { ChromaKeyVideo, defineChromaKeyVideoElement, autoTunePlugin, DEFAULTS } from '/src/chromakey.js';

window.CKV = { ChromaKeyVideo, defineChromaKeyVideoElement, autoTunePlugin, DEFAULTS };
window.players = {};
let nextId = 1;
let nextMediaId = 1;

const W = 320, H = 240;

// Synthetic test pattern (default: green screen):
// - background: key color (40,200,40) green / (40,40,200) blue
// - vertical red stripe x 120-200, full height (foreground; crosses fade zones)
// - red marker top-left 0-40 sq, blue marker bottom-right (y-flip canaries)
// - partial-ramp patch rgb(171,180,158) at x 40-100, y 100-140 (expected alpha ~120)
// - spill patch rgb(235,250,232) at x 220-280, y 100-140 (sat .072 fails key gate, dom 15 spills)
function drawPattern(ctx, channel) {
  ctx.fillStyle = channel === 'blue' ? 'rgb(40,40,200)' : 'rgb(40,200,40)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgb(200,40,40)';
  ctx.fillRect(120, 0, 80, H);
  ctx.fillRect(0, 0, 40, 40);
  ctx.fillStyle = 'rgb(40,40,200)';
  ctx.fillRect(280, 200, 40, 40);
  if (channel !== 'blue') {
    ctx.fillStyle = 'rgb(171,180,158)';
    ctx.fillRect(40, 100, 60, 40);
    ctx.fillStyle = 'rgb(235,250,232)';
    ctx.fillRect(220, 100, 60, 40);
  }
}

// captureStream only emits frames on draw commits, so keep redrawing the
// (identical) pattern on an interval to feed the video a steady frame rate.
// fps=0 uses the no-arg, draw-triggered captureStream() instead of a fixed
// capture rate, so stopping the redraw interval genuinely stops new frames
// from being produced (rather than the fixed-rate capture re-encoding the
// same static content) — needed to simulate a real stalled track.
function makePatternStream(channel = 'green', w = W, h = H, fps = 30) {
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');
  drawPattern(ctx, channel);
  const stream = fps ? canvas.captureStream(fps) : canvas.captureStream();
  const timer = setInterval(() => drawPattern(ctx, channel), 50);
  return { stream, canvas, timer, ctx };
}

// Create a player from a synthetic pattern stream, mount it, wait for the
// first rendered frame, and return its handle id. srcWidth/srcHeight set the
// pattern canvas's (i.e. the video's native) resolution, independent of the
// player canvas's CSS display size (cssWidth/cssHeight).
window.createPlayer = (options = {}, { channel = 'green', cssWidth = W, cssHeight = H, srcWidth = W, srcHeight = H, fps = 30 } = {}) => {
  return new Promise((resolve, reject) => {
    const { stream, canvas, timer, ctx } = makePatternStream(channel, srcWidth, srcHeight, fps);
    const player = new ChromaKeyVideo(stream, {
      maxPixelRatio: 1,
      videoAttributes: { ...DEFAULTS.videoAttributes, autoplay: true },
      ...options,
    });
    player.canvas.style.width = cssWidth + 'px';
    player.canvas.style.height = cssHeight + 'px';
    player.mount(document.getElementById('stage'));
    const id = String(nextId++);
    window.players[id] = { player, timer, sourceCanvas: canvas, sourceCtx: ctx, channel };
    const timeout = setTimeout(() => reject(new Error('player never started')), 10000);
    player.addEventListener('started', () => {
      // Let a couple more frames land so sampling sees steady-state output.
      setTimeout(() => { clearTimeout(timeout); resolve(id); }, 200);
    }, { once: true });
    player.addEventListener('error', (e) => reject(e.detail));
    player.play().catch(() => {});
  });
};

// Stops feeding new frames into a player's source stream, simulating a
// track that goes silent while still reporting healthy paused/ended/readyState.
window.stopSource = (id) => {
  clearInterval(window.players[id].timer);
  window.players[id].timer = 0;
};

// Resumes feeding frames after stopSource().
window.resumeSource = (id) => {
  const entry = window.players[id];
  if (entry.timer) return;
  entry.timer = setInterval(() => drawPattern(entry.sourceCtx, entry.channel), 50);
};

// Reports the video's decoded-frame counter, for diagnosing whether the
// stall-detection signal (getVideoPlaybackQuality().totalVideoFrames) is
// actually advancing/frozen in this browser/environment.
window.playbackQuality = (id) => {
  const v = window.players[id].player.video;
  if (typeof v.getVideoPlaybackQuality !== 'function') return null;
  return v.getVideoPlaybackQuality().totalVideoFrames;
};

// Resizes a player's source pattern canvas, simulating a live track's native
// resolution changing mid-stream (e.g. a WebRTC renegotiation). The video
// element fires its native 'resize' event once the new dimensions decode.
window.resizeSource = (id, w, h) => {
  const { sourceCanvas, channel } = window.players[id];
  sourceCanvas.width = w;
  sourceCanvas.height = h;
  drawPattern(sourceCanvas.getContext('2d'), channel);
};

// Real WebRTC source (issue #6): sends the pattern track through an actual
// loopback RTCPeerConnection pair (real SDP offer/answer, real ICE, real
// SRTP encode/decode) and returns a <video> wired to the *remote* track via
// `srcObject`, hidden and appended to the document — not the same object as
// captureStream()'s own MediaStream, so this exercises the real WebRTC media
// pipeline rather than only the synthetic capture path used elsewhere.
// No STUN/TURN/network is needed: both peers are local objects in the same
// page, so ICE resolves over the loopback interface.
window.__mediaCleanup = [];
window.cleanupMedia = () => {
  while (window.__mediaCleanup.length) {
    try { window.__mediaCleanup.pop()(); } catch { /* best-effort */ }
  }
};

window.createWebRTCVideo = async (channel = 'green', w = W, h = H, fps = 30) => {
  const { stream, timer } = makePatternStream(channel, w, h, fps);
  const pc1 = new RTCPeerConnection();
  const pc2 = new RTCPeerConnection();
  window.__mediaCleanup.push(() => {
    clearInterval(timer);
    pc1.close();
    pc2.close();
  });
  pc1.onicecandidate = (e) => { if (e.candidate) pc2.addIceCandidate(e.candidate); };
  pc2.onicecandidate = (e) => { if (e.candidate) pc1.addIceCandidate(e.candidate); };
  const remoteStreamPromise = new Promise((resolve) => {
    pc2.ontrack = (e) => resolve(e.streams[0]);
  });
  for (const track of stream.getTracks()) pc1.addTrack(track, stream);
  const offer = await pc1.createOffer();
  await pc1.setLocalDescription(offer);
  await pc2.setRemoteDescription(offer);
  const answer = await pc2.createAnswer();
  await pc2.setLocalDescription(answer);
  await pc1.setRemoteDescription(answer);
  const remoteStream = await remoteStreamPromise;

  const video = document.createElement('video');
  video.autoplay = true;
  video.muted = true;
  video.playsInline = true;
  video.style.display = 'none';
  video.srcObject = remoteStream;
  const id = 'webrtc-' + nextMediaId++;
  video.id = id;
  document.body.appendChild(video);
  await new Promise((resolve) => video.addEventListener('loadedmetadata', resolve, { once: true }));
  return id;
};

// Real HLS source (issue #6): loads an actual generated VOD fixture
// (test/assets/hls/playlist.m3u8, 3 segments) through hls.js — a real
// third-party player library attaching to a <video> element, the exact
// shape the slotted-video mechanism exists to support — and returns the
// <video> id once its manifest is parsed and media is attached.
window.createHlsVideo = (url = '/test/assets/hls/playlist.m3u8') => {
  return new Promise((resolve, reject) => {
    const video = document.createElement('video');
    video.autoplay = true;
    video.muted = true;
    video.playsInline = true;
    video.style.display = 'none';
    document.body.appendChild(video);
    const hls = new Hls();
    window.__mediaCleanup.push(() => hls.destroy());
    const timeout = setTimeout(() => reject(new Error('hls manifest never parsed')), 10000);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      clearTimeout(timeout);
      const id = 'hls-' + nextMediaId++;
      video.id = id;
      resolve(id);
    });
    hls.on(Hls.Events.ERROR, (event, data) => {
      if (data.fatal) { clearTimeout(timeout); reject(new Error('hls fatal error: ' + data.type)); }
    });
    hls.loadSource(url);
    hls.attachMedia(video);
  });
};

// Record ~1.2s of the pattern to a webm blob and return an object URL —
// exercises the URL-source constructor path with a real encoded video.
window.makePatternVideoURL = (channel = 'green') => {
  return new Promise((resolve, reject) => {
    const { stream, timer } = makePatternStream(channel);
    const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
    const chunks = [];
    recorder.ondataavailable = (e) => chunks.push(e.data);
    recorder.onstop = () => {
      clearInterval(timer);
      resolve(URL.createObjectURL(new Blob(chunks, { type: 'video/webm' })));
    };
    recorder.onerror = (e) => reject(e.error);
    recorder.start();
    setTimeout(() => recorder.stop(), 1200);
  });
};

// Create a player directly from a source URL (webm/mp4).
window.createPlayerFromURL = (url, options = {}) => {
  return new Promise((resolve, reject) => {
    const player = new ChromaKeyVideo(url, {
      maxPixelRatio: 1,
      videoAttributes: { ...DEFAULTS.videoAttributes, autoplay: true, loop: true },
      ...options,
    });
    player.canvas.style.width = W + 'px';
    player.canvas.style.height = H + 'px';
    player.mount(document.getElementById('stage'));
    const id = String(nextId++);
    window.players[id] = { player, timer: 0 };
    const timeout = setTimeout(() => reject(new Error('player never started')), 10000);
    player.addEventListener('started', () => {
      setTimeout(() => { clearTimeout(timeout); resolve(id); }, 300);
    }, { once: true });
    player.addEventListener('error', (e) => reject(new Error('video error: ' + (e.detail && e.detail.message))));
    player.play().catch(() => {});
  });
};

// Sample one pixel of a player's display canvas at fractional coordinates.
// Returns [r, g, b, a] with straight (un-premultiplied) color values.
window.sample = (id, xf, yf) => {
  const { player } = window.players[id];
  const c = player.canvas;
  const ctx = c.getContext('2d');
  const x = Math.min(c.width - 1, Math.round(xf * c.width));
  const y = Math.min(c.height - 1, Math.round(yf * c.height));
  const d = ctx.getImageData(x, y, 1, 1).data;
  return [d[0], d[1], d[2], d[3]];
};

window.destroyPlayer = (id) => {
  const entry = window.players[id];
  if (entry) {
    entry.player.destroy();
    if (entry.timer) clearInterval(entry.timer);
    delete window.players[id];
  }
};

// Mounts a <chroma-key-video> custom element (issue #6). `videoId`, if given,
// is the id of a <video> already in the document (from createWebRTCVideo/
// createHlsVideo/plain createElement) — it's appended as a light-DOM child
// (slotted source) before connecting the element, so slot detection sees it
// on the same tick as connectedCallback. `attrs.src` can be set alongside a
// slotted video to exercise precedence.
window.elements = {};
window.mountElement = (attrs = {}, videoId = null) => {
  return new Promise((resolve, reject) => {
    window.CKV.defineChromaKeyVideoElement();
    const el = document.createElement('chroma-key-video');
    el.style.width = '320px'; // give the host a definite CSS size (no aspect-ratio-only auto-sizing)
    for (const [k, v] of Object.entries(attrs)) {
      if (v === false || v == null) continue;
      el.setAttribute(k, v === true ? '' : String(v));
    }
    if (videoId) el.appendChild(document.getElementById(videoId));
    const id = 'el-' + nextMediaId++;
    window.elements[id] = el;
    document.getElementById('stage').appendChild(el);
    const timeout = setTimeout(() => reject(new Error('element player never started')), 10000);
    // A slotted video can already be decoding (WebRTC/HLS were readied before
    // being appended), so the player's first frame — and its 'started' event —
    // can fire synchronously inside connectedCallback, before this polling
    // loop gets a chance to attach a listener. Check frameCount first so an
    // already-fired 'started' isn't missed.
    const waitStarted = () => {
      if (!el.player) { setTimeout(waitStarted, 20); return; }
      const settle = () => setTimeout(() => { clearTimeout(timeout); resolve(id); }, 200);
      if (el.player.frameCount > 0) { settle(); return; }
      el.player.addEventListener('started', settle, { once: true });
      el.player.addEventListener('error', (e) => reject(e.detail));
    };
    waitStarted();
  });
};

// Samples one pixel of a mounted element's display canvas (same convention
// as window.sample, but reading through window.elements instead of players).
window.sampleElement = (id, xf, yf) => {
  const c = window.elements[id].player.canvas;
  const ctx = c.getContext('2d');
  const x = Math.min(c.width - 1, Math.round(xf * c.width));
  const y = Math.min(c.height - 1, Math.round(yf * c.height));
  const d = ctx.getImageData(x, y, 1, 1).data;
  return [d[0], d[1], d[2], d[3]];
};

window.fixtureReady = true;
</script>
</body>
</html>
